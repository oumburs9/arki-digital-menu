<!doctype html>
<html><head><meta charset="utf-8"><title>Arki Menu</title>
<script>
  // GitHub Pages: send deep links like /arki-digital-menu/m/tsehay-coffee?t=5 back to the app.
  var parts = location.pathname.split("/");
  var base = "/" + parts[1];
  var rest = "/" + parts.slice(2).join("/");
  location.replace(base + "/?p=" + encodeURIComponent(rest + location.search));
</script></head><body></body></html>
